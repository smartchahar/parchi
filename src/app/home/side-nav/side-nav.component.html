<ng-sidebar-container>
    <ng-sidebar [opened]="opened">
        <mat-toolbar>
            <div class="top-toolbar" style="background-color: #673ab7; height: 200px; align-items: flex-start;">
                <span><i class="fa fa-arrow-left" style="margin-top: 12px;" (click)="toggleSideBar()"></i></span>
                <mat-toolbar-row >My App</mat-toolbar-row>
            </div>
            <div class="top-toolbar" (click)="navigateTo()">
                <span><i class="fa fa-paper-plane"></i></span>
                <mat-toolbar-row >Matches</mat-toolbar-row>
            </div>
            <div class="top-toolbar" (click)="navigateTo()">
                <span><i class="fa fa-address-book"></i></span>
                <mat-toolbar-row >Accounts</mat-toolbar-row>
            </div>
            <div class="top-toolbar" (click)="navigateTo()">
                <span><i class="fa fa-cogs"></i></span>
                <mat-toolbar-row >Settings</mat-toolbar-row>
            </div>
            <div class="top-toolbar" (click)="logout()">
                <span><i class="fa fa-sign-out"></i></span>
                <mat-toolbar-row >Logout</mat-toolbar-row>
            </div>
        </mat-toolbar>     
    </ng-sidebar>
    <div ng-sidebar-content>
        <mat-toolbar class="top-toolbar-container" color="primary">
            <div class="top-toolbar">
                <span><i class="fa fa-bars" (click)="toggleSideBar()"></i></span>
                <mat-toolbar-row >Welcome to App</mat-toolbar-row>  
            </div>
        </mat-toolbar>
