<div class="form_bg">
    <div class="container">
      <div class="row">
        <div class="col-md-offset-4 col-md-4 col-sm-off-3 col-sm-6">
          <form [formGroup]="loginForm" class="form_horizontal" (ngSubmit)="onLogin()">
            <div class="form_icon"><i class="fa fa-user-circle"></i></div>
            <h3 class="title">login form</h3>
            <div class="form-group">
              <span class="input-icon"><i class="fa fa-user"></i></span>
              <input class="form-control" formControlName="userName" type="text"
              placeholder="Username" [ngClass]="{'is-invalid': loginForm.controls.userName.invalid && loginForm.controls.userName.touched}" required>
            </div>
            <div *ngIf="true" class="form-group text-danger">
              <div *ngIf="true">Username is required</div>
            </div>
            <div class="form-group">
              <span class="input-icon"><i class="fa fa-lock"></i></span>
              <input class="form-control" formControlName="password" type="password"
              placeholder="Password" [ngClass]="{'is-invalid': loginForm.controls.userName.invalid && loginForm.controls.userName.touched}" required>
              <div *ngIf="loginForm.controls.password.errors" class="text-danger">
                <div *ngIf="loginForm.controls.password.errors.required">Password is required</div>
              </div>
            </div>
  
            <button type="submit" class="btn signin" [disabled]="!loginForm.valid">login</button>
            <ul class="form-options">
              <li><a href="#">Forget Password?</a></li>
              <li><a href="#">Create New Account<i class="fa fa-arrow-right"></i></a></li>
            </ul>
          </form>
        </div>
      </div>
    </div>
  </div>
